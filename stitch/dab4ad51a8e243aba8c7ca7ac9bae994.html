<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Over - Tetris Supervisor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#004965",
                        "primary": "#8ed5ff",
                        "on-surface": "#d5e3fd",
                        "primary-fixed-dim": "#7bd0ff",
                        "tertiary": "#ffbcbf",
                        "surface-tint": "#7bd0ff",
                        "on-tertiary-fixed": "#40000d",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "surface-container": "#122033",
                        "surface-variant": "#273649",
                        "on-tertiary-fixed-variant": "#92002a",
                        "on-secondary": "#003915",
                        "on-tertiary-container": "#8c0028",
                        "on-secondary-fixed-variant": "#005321",
                        "primary-fixed": "#c4e7ff",
                        "surface-container-lowest": "#010f21",
                        "secondary-fixed-dim": "#4ae176",
                        "secondary-fixed": "#6bff8f",
                        "error": "#ffb4ab",
                        "on-background": "#d5e3fd",
                        "inverse-on-surface": "#233144",
                        "on-primary-fixed": "#001e2c",
                        "secondary": "#4ae176",
                        "on-primary": "#00354a",
                        "primary-container": "#38bdf8",
                        "surface": "#051426",
                        "outline": "#87929a",
                        "surface-dim": "#051426",
                        "on-primary-fixed-variant": "#004c69",
                        "surface-container-highest": "#273649",
                        "on-secondary-container": "#004119",
                        "secondary-container": "#00b954",
                        "outline-variant": "#3e484f",
                        "surface-bright": "#2c3a4e",
                        "tertiary-container": "#ff929a",
                        "tertiary-fixed": "#ffdadb",
                        "background": "#051426",
                        "inverse-primary": "#00668a",
                        "on-surface-variant": "#bdc8d1",
                        "on-tertiary": "#67001b",
                        "surface-container-low": "#0d1c2f",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "surface-container-high": "#1c2b3e",
                        "inverse-surface": "#d5e3fd",
                        "on-secondary-fixed": "#002109"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit-1": "4px",
                        "unit-8": "32px",
                        "unit-4": "16px",
                        "container-margin": "24px",
                        "base": "4px",
                        "unit-2": "8px",
                        "unit-6": "24px",
                        "grid-gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Sora"],
                        "body-lg": ["Sora"],
                        "label-md": ["JetBrains Mono"],
                        "headline-lg": ["Sora"],
                        "body-md": ["Sora"],
                        "display-lg": ["Sora"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-md": ["Sora"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .ghost-grid {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center ghost-grid p-unit-6 md:p-unit-8">
<!-- Ambient HUD Glow -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden flex items-center justify-center">
<div class="absolute w-[800px] h-[800px] bg-error rounded-full opacity-5 blur-[150px]"></div>
</div>
<!-- Main Game Over Container -->
<main class="relative z-10 w-full max-w-2xl bg-surface/80 backdrop-blur-md border border-outline-variant rounded-xl p-unit-8 flex flex-col items-center gap-unit-8 shadow-[0_0_40px_rgba(255,180,171,0.1)]">
<!-- Header -->
<div class="text-center w-full border-b border-outline-variant pb-unit-6">
<h1 class="font-display-lg text-display-lg text-error uppercase tracking-tighter mb-unit-2" style="text-shadow: 0 0 20px rgba(255,180,171,0.5);">Game Over</h1>
<p class="font-label-md text-label-md text-on-surface-variant flex items-center justify-center gap-unit-2">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
                SUPERVISOR SESSION TERMINATED
                <span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
</p>
</div>
<!-- Stats Bento Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-unit-4 w-full">
<!-- Final Score (Hero Stat) -->
<div class="bg-surface-container border border-outline-variant rounded-lg p-unit-6 flex flex-col items-center justify-center col-span-1 md:col-span-2 relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-unit-2">Final Score</h2>
<div class="font-display-lg text-display-lg text-primary">1,420,050</div>
<!-- High Score Comparison -->
<div class="mt-unit-4 flex items-center gap-unit-2 bg-surface-container-high px-unit-4 py-unit-2 rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-secondary text-sm">military_tech</span>
<span class="font-label-md text-label-md text-on-surface">Personal Best: 1,850,200</span>
</div>
</div>
<!-- Level Reached -->
<div class="bg-surface-container border border-outline-variant rounded-lg p-unit-6 flex flex-col items-center justify-center relative group hover:border-secondary transition-colors">
<span class="material-symbols-outlined text-secondary text-opacity-20 text-[64px] absolute right-unit-4 bottom-unit-4 pointer-events-none">stairs</span>
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-unit-2">Level Reached</h2>
<div class="font-headline-lg text-headline-lg text-secondary">24</div>
</div>
<!-- Lines Cleared -->
<div class="bg-surface-container border border-outline-variant rounded-lg p-unit-6 flex flex-col items-center justify-center relative group hover:border-primary-container transition-colors">
<span class="material-symbols-outlined text-primary-container text-opacity-20 text-[64px] absolute left-unit-4 bottom-unit-4 pointer-events-none">clear_all</span>
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-unit-2">Lines Cleared</h2>
<div class="font-headline-lg text-headline-lg text-primary-container">235</div>
</div>
<!-- Detailed Stats Array -->
<div class="col-span-1 md:col-span-2 bg-surface-container border border-outline-variant rounded-lg p-unit-4">
<h3 class="font-label-sm text-label-sm text-on-surface-variant border-b border-outline-variant pb-unit-2 mb-unit-4">PERFORMANCE TELEMETRY</h3>
<div class="grid grid-cols-2 md:grid-cols-4 gap-unit-4">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">Tetris Clears</span>
<span class="font-label-md text-label-md text-on-surface mt-unit-1">15</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">T-Spins</span>
<span class="font-label-md text-label-md text-on-surface mt-unit-1">8</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">Max Combo</span>
<span class="font-label-md text-label-md text-on-surface mt-unit-1">6</span>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant">Session Time</span>
<span class="font-label-md text-label-md text-on-surface mt-unit-1">14:22</span>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col md:flex-row gap-unit-4 w-full mt-unit-4">
<button class="flex-1 bg-primary-container text-[#000000] font-label-md text-label-md py-unit-4 px-unit-6 rounded flex items-center justify-center gap-unit-2 hover:bg-primary-fixed hover:-translate-y-px hover:shadow-[0_2px_0_0_#0ea5e9] transition-all border border-transparent">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">replay</span>
                INITIATE REPLAY
            </button>
<button class="flex-1 bg-surface-container border border-outline text-on-surface font-label-md text-label-md py-unit-4 px-unit-6 rounded flex items-center justify-center gap-unit-2 hover:bg-surface-variant hover:border-outline-variant transition-colors">
<span class="material-symbols-outlined">menu</span>
                RETURN TO TERMINAL
            </button>
</div>
</main>
</body></html>
