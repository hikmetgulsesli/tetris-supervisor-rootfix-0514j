<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Supervisor - Paused</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#004965",
                        "primary": "#8ed5ff",
                        "on-surface": "#d5e3fd",
                        "primary-fixed-dim": "#7bd0ff",
                        "tertiary": "#ffbcbf",
                        "surface-tint": "#7bd0ff",
                        "on-tertiary-fixed": "#40000d",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "surface-container": "#122033",
                        "surface-variant": "#273649",
                        "on-tertiary-fixed-variant": "#92002a",
                        "on-secondary": "#003915",
                        "on-tertiary-container": "#8c0028",
                        "on-secondary-fixed-variant": "#005321",
                        "primary-fixed": "#c4e7ff",
                        "surface-container-lowest": "#010f21",
                        "secondary-fixed-dim": "#4ae176",
                        "secondary-fixed": "#6bff8f",
                        "error": "#ffb4ab",
                        "on-background": "#d5e3fd",
                        "inverse-on-surface": "#233144",
                        "on-primary-fixed": "#001e2c",
                        "secondary": "#4ae176",
                        "on-primary": "#00354a",
                        "primary-container": "#38bdf8",
                        "surface": "#051426",
                        "outline": "#87929a",
                        "surface-dim": "#051426",
                        "on-primary-fixed-variant": "#004c69",
                        "surface-container-highest": "#273649",
                        "on-secondary-container": "#004119",
                        "secondary-container": "#00b954",
                        "outline-variant": "#3e484f",
                        "surface-bright": "#2c3a4e",
                        "tertiary-container": "#ff929a",
                        "tertiary-fixed": "#ffdadb",
                        "background": "#051426",
                        "inverse-primary": "#00668a",
                        "on-surface-variant": "#bdc8d1",
                        "on-tertiary": "#67001b",
                        "surface-container-low": "#0d1c2f",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "surface-container-high": "#1c2b3e",
                        "inverse-surface": "#d5e3fd",
                        "on-secondary-fixed": "#002109"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit-1": "4px",
                        "unit-8": "32px",
                        "unit-4": "16px",
                        "container-margin": "24px",
                        "base": "4px",
                        "unit-2": "8px",
                        "unit-6": "24px",
                        "grid-gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Sora"],
                        "body-lg": ["Sora"],
                        "label-md": ["JetBrains Mono"],
                        "headline-lg": ["Sora"],
                        "body-md": ["Sora"],
                        "display-lg": ["Sora"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-md": ["Sora"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative font-body-md text-body-md">
<!-- Mock Background (Simulating the Game Board) -->
<div class="absolute inset-0 grid grid-cols-12 gap-grid-gutter p-container-margin opacity-30 pointer-events-none" style="background-image: repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(255,255,255,0.05) 20px), repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(255,255,255,0.05) 20px);">
<!-- Background Elements to blur -->
<div class="col-span-3 bg-surface-container border border-outline-variant h-full rounded"></div>
<div class="col-span-6 bg-surface border border-outline-variant h-full rounded flex items-end justify-center pb-8">
<!-- Mock Tetris Blocks -->
<div class="w-10 h-10 bg-primary-container opacity-50 m-1"></div>
<div class="w-10 h-10 bg-primary-container opacity-50 m-1"></div>
<div class="w-10 h-10 bg-secondary-container opacity-50 m-1"></div>
</div>
<div class="col-span-3 bg-surface-container border border-outline-variant h-full rounded"></div>
</div>
<!-- Pause Overlay (Glassmorphism) -->
<div class="absolute inset-0 bg-surface/70 backdrop-blur-md flex flex-col items-center justify-center z-50">
<!-- Pause Menu Container -->
<div class="flex flex-col items-center max-w-md w-full px-container-margin">
<!-- Header -->
<div class="mb-unit-8 flex flex-col items-center">
<span class="material-symbols-outlined text-primary-container mb-unit-4" style="font-size: 64px;">pause_circle</span>
<h1 class="font-display-lg text-display-lg text-on-surface tracking-widest uppercase">Paused</h1>
<div class="h-px w-32 bg-primary-container mt-unit-2"></div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col w-full gap-unit-4">
<!-- Resume Button (Primary) -->
<button class="w-full bg-primary-container text-surface-container-lowest font-label-md text-label-md uppercase py-unit-4 px-unit-6 rounded flex items-center justify-center gap-unit-2 hover:bg-primary-fixed hover:outline hover:outline-2 hover:outline-offset-2 hover:outline-primary-container transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    Resume Game
                </button>
<!-- Restart Button (Secondary) -->
<button class="w-full bg-surface-container border border-outline-variant text-on-surface font-label-md text-label-md uppercase py-unit-4 px-unit-6 rounded flex items-center justify-center gap-unit-2 hover:bg-surface-variant hover:border-primary-container transition-all">
<span class="material-symbols-outlined">refresh</span>
                    Restart Module
                </button>
<!-- Return to Menu Button (Secondary/Destructive intent but styled neutrally here per design system) -->
<button class="w-full bg-surface-container border border-outline-variant text-on-surface-variant font-label-md text-label-md uppercase py-unit-4 px-unit-6 rounded flex items-center justify-center gap-unit-2 hover:bg-surface-variant hover:text-on-surface transition-all mt-unit-4">
<span class="material-symbols-outlined">logout</span>
                    Return to Terminal
                </button>
</div>
<!-- System Status indicator (Flavor) -->
<div class="mt-unit-8 flex items-center gap-unit-2">
<div class="w-2 h-2 rounded-full bg-secondary-container animate-pulse"></div>
<span class="font-label-sm text-label-sm text-outline">SYSTEM STANDBY</span>
</div>
</div>
</div>
</body></html>
