<style>
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(135, 146, 154, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(135, 146, 154, 0.1) 1px, transparent 1px);
            background-size: 32px 32px;
        }
      </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md relative overflow-hidden">
<!-- Background Grid & Subtle Tetrominos -->
<div class="absolute inset-0 bg-grid-pattern z-0 pointer-events-none"></div>
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
<div class="absolute top-20 left-[10%] w-16 h-16 bg-primary-container border border-primary-container rounded shadow-[0_0_15px_rgba(56,189,248,0.5)] transform rotate-12"></div>
<div class="absolute top-40 left-[10%] w-16 h-16 bg-primary-container border border-primary-container rounded shadow-[0_0_15px_rgba(56,189,248,0.5)] transform rotate-12"></div>
<div class="absolute top-60 left-[10%] w-16 h-16 bg-primary-container border border-primary-container rounded shadow-[0_0_15px_rgba(56,189,248,0.5)] transform rotate-12"></div>
<div class="absolute top-80 left-[10%] w-16 h-16 bg-primary-container border border-primary-container rounded shadow-[0_0_15px_rgba(56,189,248,0.5)] transform rotate-12"></div>
<div class="absolute bottom-20 right-[15%] w-16 h-16 bg-secondary border border-secondary rounded shadow-[0_0_15px_rgba(74,225,118,0.5)] transform -rotate-6"></div>
<div class="absolute bottom-20 right-[calc(15%+64px)] w-16 h-16 bg-secondary border border-secondary rounded shadow-[0_0_15px_rgba(74,225,118,0.5)] transform -rotate-6"></div>
<div class="absolute bottom-[calc(5rem+64px)] right-[calc(15%+64px)] w-16 h-16 bg-secondary border border-secondary rounded shadow-[0_0_15px_rgba(74,225,118,0.5)] transform -rotate-6"></div>
<div class="absolute bottom-[calc(5rem+128px)] right-[calc(15%+64px)] w-16 h-16 bg-secondary border border-secondary rounded shadow-[0_0_15px_rgba(74,225,118,0.5)] transform -rotate-6"></div>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center relative z-10 p-unit-6 md:p-container-margin">
<div class="max-w-2xl w-full flex flex-col items-center">
<!-- Title Header -->
<div class="text-center mb-12">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter uppercase mb-4 shadow-primary drop-shadow-[0_0_10px_rgba(142,213,255,0.3)]">
                    Tetris Supervisor
                </h1>
<div class="flex items-center justify-center space-x-2">
<span class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_rgba(74,225,118,0.8)]"></span>
<span class="font-label-md text-label-md text-secondary">SYSTEM NOMINAL // V.1.0.4</span>
</div>
</div>
<!-- Menu Options (Bento-style layout) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-unit-4 w-full max-w-lg">
<!-- Primary Action: New Game -->
<button class="col-span-1 md:col-span-2 bg-primary-container text-[#0F172A] border-2 border-primary-container rounded hover:bg-[#5fcfff] hover:-translate-y-[2px] transition-all duration-150 flex items-center justify-center py-unit-4 px-unit-6 group shadow-[0_4px_14px_0_rgba(56,189,248,0.39)]">
<span class="material-symbols-outlined mr-3 text-3xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span class="font-headline-md text-headline-md font-bold tracking-tight">INITIATE SEQUENCE</span>
</button>
<!-- Secondary Action: Resume -->
<button class="col-span-1 md:col-span-2 bg-surface-container border border-outline-variant rounded py-unit-4 px-unit-6 flex items-center justify-between hover:bg-surface-variant hover:border-outline hover:-translate-y-[2px] transition-all duration-150">
<div class="flex items-center">
<span class="material-symbols-outlined text-outline mr-3">restore</span>
<div class="text-left">
<span class="font-headline-md text-[20px] text-on-surface font-semibold block leading-tight">Resume Session</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Station 01 • Level 12</span>
</div>
</div>
<span class="font-label-md text-label-md text-secondary border border-secondary px-2 py-1 rounded bg-secondary/10">ACTIVE</span>
</button>
<!-- Tertiary Actions -->
<button class="bg-surface-container border border-outline-variant rounded py-unit-4 px-unit-6 flex flex-col items-center justify-center hover:bg-surface-variant hover:border-outline hover:-translate-y-[2px] transition-all duration-150">
<span class="material-symbols-outlined text-outline mb-2 text-3xl">sports_esports</span>
<span class="font-headline-md text-[18px] text-on-surface font-semibold">Controls</span>
</button>
<button class="bg-surface-container border border-outline-variant rounded py-unit-4 px-unit-6 flex flex-col items-center justify-center hover:bg-surface-variant hover:border-outline hover:-translate-y-[2px] transition-all duration-150">
<span class="material-symbols-outlined text-outline mb-2 text-3xl">settings</span>
<span class="font-headline-md text-[18px] text-on-surface font-semibold">Settings</span>
</button>
</div>
</div>
</main>
<!-- Footer Component -->
<footer class="bg-surface-container-low dark:bg-surface-container-low docked full-width bottom-0 border-t border-outline-variant flat no shadows w-full py-unit-2 px-unit-6 flex justify-between items-center text-xs relative z-20">
<div class="font-label-sm text-label-sm text-on-surface-variant">
            © 2024 TETRIS_SUPERVISOR_CORE
        </div>
<div class="flex space-x-unit-4">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-opacity duration-300" href="#">Protocol</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-opacity duration-300" href="#">EULA</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-opacity duration-300" href="#">Support</a>
</div>
</footer>
